<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
        rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seus itens favoritos </title>
</head>

<body>
    <header class="header-info">
        <div class="container">
            <span class="logo">Catálogo</span>
            <nav class="menu">
                <ul>
                    <li><a href="começo.html"><i class="fa-solid fa-bars menu-icon"></i>Catálogo</a></li>
                    <li><a href="/projeto/contato.html"><i class="fa-solid fa-phone"></i>Contato</a></li>
                </ul>
            </nav>
            <div class="pesquisa">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Buscar itens...">
            </div>
            <div class="acoes">
                <a href="carrinho.html" class="carrinho">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="carrinho-count" class="contador">0</span>
                </a>
                <a href="favoritos.html" class="favoritos">
                    <i class="fa-regular fa-heart"></i>
                    <span id="favoritos-count" class="contador">0</span>
                </a>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="bem-vindo-favoritos">
            <h1>Seus itens favoritos</h1>
        </div>
        <section class="catalogo">
            <!--<template>-->
            <article class="card">
                <img src="https://picsum.photos/400/300" alt="Prato japonês">
                <h3>Sushi de Salmão</h3>
                <p>R$ 39,90</p>
                <div class="acoes">
                    <div class="quantidade">
                        <button>-</button>
                        <span>1</span>
                        <button>+</button>
                    </div>
                    <button class="comprar">
                        🛒 Comprar
                    </button>
                </div>
            </article>
            <!--</template>-->
        </section>
    </main>
    <footer class="rodape">
        <p> @ Joao pedro nascimento de freitas. Todos os direitos reservados. 2026 </p>
    </footer>
    <script src="script.js"></script>
</body>

</html>
